<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — TECHNOVA</title>
  <meta name="description" content="View and track all your TECHNOVA orders.">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="announcement-bar">🎉 Free shipping on orders over $100! <a href="/shop.html">Shop Now →</a></div>
  <header class="header"><div class="container header-inner">
    <a href="/index.html" class="header-logo"><div class="logo-mark">T</div><span class="logo-text">TECH<span>NOVA</span></span></a>
    <div class="search-bar"><div class="search-input-wrap"><input type="text" id="search-input" class="search-input" placeholder="Search products..."><button class="search-btn" id="search-btn">🔍 Search</button></div></div>
    <div class="header-actions">
      <a href="/account-profile.html" id="account-btn" class="header-action-btn"><span>👤</span><span class="action-label" id="account-label">Account</span></a>
      <a href="/wishlist.html" class="header-action-btn"><span>♡</span><span class="action-label">Wishlist</span><span class="action-badge" id="wishlist-badge" style="display:none">0</span></a>
      <a href="/cart.html" class="header-action-btn"><span>🛒</span><span class="action-label">Cart</span><span class="action-badge" id="cart-badge" style="display:none">0</span></a>
      <a href="/signin.html" id="logout-btn" class="header-action-btn" style="display:none"><span>🚪</span><span class="action-label">Logout</span></a>
    </div>
  </div></header>

  <main class="container section page-enter">
    <div class="breadcrumb"><a href="/index.html">Home</a><span class="breadcrumb-sep">›</span><a href="/account-profile.html">Account</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">My Orders</span></div>
    <div class="account-layout">
      <aside class="account-sidebar">
        <div class="account-sidebar-user">
          <div class="account-avatar" id="avatar-initials">?</div>
          <div class="account-name" id="sidebar-name">My Account</div>
          <div class="account-email" id="sidebar-email"></div>
        </div>
        <nav class="account-nav">
          <a href="/account-profile.html" class="account-nav-link">👤 My Profile</a>
          <a href="/account-orders.html" class="account-nav-link active">📦 My Orders</a>
          <a href="/wishlist.html" class="account-nav-link">♡ Wishlist</a>
          <a href="/compare.html" class="account-nav-link">⚖ Compare</a>
          <a href="/help.html" class="account-nav-link">❓ Help & Support</a>
          <a href="#" class="account-nav-link" style="color:var(--color-error)" onclick="event.preventDefault();Auth.logout()">🚪 Sign Out</a>
        </nav>
      </aside>
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)">
          <h1 style="font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)">My Orders</h1>
          <div style="display:flex;gap:var(--space-2)">
            <button class="btn btn-outline-dark btn-sm filter-btn active" onclick="filterOrders('', this)">All</button>
            <button class="btn btn-outline-dark btn-sm filter-btn" onclick="filterOrders('processing', this)">Processing</button>
            <button class="btn btn-outline-dark btn-sm filter-btn" onclick="filterOrders('shipped', this)">Shipped</button>
            <button class="btn btn-outline-dark btn-sm filter-btn" onclick="filterOrders('delivered', this)">Delivered</button>
          </div>
        </div>
        <div id="orders-container">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 TECHNOVA. All rights reserved.</span></div></div></footer>
  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    Auth.updateHeaderUI(); CartManager.updateBadge(); WishlistManager.updateBadge();
    document.getElementById('search-btn').addEventListener('click', () => { const q = document.getElementById('search-input').value.trim(); if(q) window.location.href=`/search.html?q=${encodeURIComponent(q)}`; });
    document.getElementById('search-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('search-btn').click(); });

    async function loadProfile() {
      try {
        const data = await api.getProfile();
        const p = data.customer;
        const names = (p.name || '').split(' ');
        document.getElementById('avatar-initials').textContent = (names[0]?.[0] || '') + (names[1]?.[0] || '');
        document.getElementById('sidebar-name').textContent = p.name || '';
        document.getElementById('sidebar-email').textContent = p.email || '';
      } catch {}
    }

    async function loadOrders(status = '') {
      const container = document.getElementById('orders-container');
      container.innerHTML = '<div class="spinner"></div>';
      try {
        const data = await api.getMyOrders(status);
        const orders = data.orders || [];
        if (!orders.length) {
          container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-title">No orders found</div><div class="empty-state-desc">You haven't placed any orders${status ? ' with this status' : ''} yet.</div><a href="/shop.html" class="btn btn-primary">Start Shopping</a></div>`;
          return;
        }
        const statusClass = { pending:'status-pending', processing:'status-processing', shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled', refunded:'status-refunded' };
        container.innerHTML = orders.map(o => `
          <div class="order-card">
            <div class="order-card-header">
              <div>
                <div style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Order ID</div>
                <div style="font-weight:var(--font-weight-bold);font-size:var(--font-size-sm)">#${o.order_id}</div>
              </div>
              <div>
                <div style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Date</div>
                <div style="font-size:var(--font-size-sm)">${formatDate(o.order_date)}</div>
              </div>
              <div>
                <div style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Total</div>
                <div style="font-weight:var(--font-weight-bold);font-size:var(--font-size-sm)">${formatCurrency(o.total_amount)}</div>
              </div>
              <span class="status-badge ${statusClass[o.status]||'status-processing'}">${o.status}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4)">
              ${(o.items||[]).map(i => `
                <div style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-xs);background:var(--color-background);padding:0.3rem 0.6rem;border-radius:var(--radius-sm)">
                  <span>${i.product_name||'Product'}</span><span style="color:var(--color-text-muted)">×${i.quantity}</span>
                </div>`).join('')}
            </div>
            <div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
              <a href="/order-details.html?id=${o.order_id}" class="btn btn-outline btn-sm">View Details</a>
              ${o.status === 'delivered' ? `<a href="/help.html#returns" class="btn btn-outline-dark btn-sm">↩ Return Item</a>` : ''}
              ${['pending','processing','shipped'].includes(o.status) ? `<a href="/help.html#track" class="btn btn-ghost btn-sm">📍 Track Order</a>` : ''}
            </div>
          </div>`).join('');
      } catch(err) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Could not load orders</div><div class="empty-state-desc">${err.message}</div></div>`;
      }
    }

    function filterOrders(status, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadOrders(status);
    }

    loadProfile();
    loadOrders();
  </script>
</body>
</html>
