<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TECHNOVA</title>
  <meta name="description" content="Create a TECHNOVA account to start shopping for premium technology products.">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/components.css">
  <style>
    body { background: linear-gradient(135deg, var(--color-navy) 0%, #0F2D5B 50%, var(--color-navy-light) 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4); }
    .auth-card { background: white; border-radius: var(--radius-2xl); box-shadow: var(--shadow-2xl); width: 100%; max-width: 480px; overflow: hidden; }
    .auth-header { background: linear-gradient(135deg, var(--color-accent-purple), var(--color-primary)); padding: var(--space-6) var(--space-8); text-align: center; color: white; }
    .auth-body { padding: var(--space-6) var(--space-8); }
    .strength-bar { height: 4px; border-radius: var(--radius-full); background: var(--color-border); margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: var(--radius-full); transition: width 0.3s, background 0.3s; width: 0%; }
    .auth-top-bar { background: rgba(255,255,255,0.08); padding: var(--space-4) var(--space-6); display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="auth-top-bar">
    <a href="/index.html" class="header-logo" style="text-decoration:none">
      <div class="logo-mark" style="width:28px;height:28px;font-size:0.85rem">T</div>
      <span class="logo-text" style="color:white;font-size:var(--font-size-lg)">TECH<span style="color:#60B2FF">NOVA</span></span>
    </a>
    <a href="/index.html" style="color:rgba(255,255,255,0.7);font-size:var(--font-size-sm)">← Back to Store</a>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size:2rem;margin-bottom:var(--space-2)">🚀</div>
        <h1 style="font-size:var(--font-size-2xl);font-weight:var(--font-weight-extrabold);margin-bottom:var(--space-1)">Create Account</h1>
        <p style="opacity:0.85;font-size:var(--font-size-sm)">Join thousands of tech enthusiasts</p>
      </div>
      <div class="auth-body">
        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="full-name">Full Name <span>*</span></label>
            <input type="text" id="full-name" class="form-input" placeholder="John Doe" required autocomplete="name">
            <span class="form-error" id="name-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address <span>*</span></label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            <span class="form-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number (optional)</label>
            <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 000-0000" autocomplete="tel">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password <span>*</span></label>
            <div style="position:relative">
              <input type="password" id="password" class="form-input" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password" style="padding-right:3rem" oninput="checkPasswordStrength(this.value)">
              <button type="button" onclick="togglePw('password')" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--color-text-muted)">👁</button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <span style="font-size:var(--font-size-xs);color:var(--color-text-muted)" id="strength-label"></span>
            <span class="form-error" id="password-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password <span>*</span></label>
            <div style="position:relative">
              <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password" style="padding-right:3rem">
              <button type="button" onclick="togglePw('confirm-password')" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--color-text-muted)">👁</button>
            </div>
            <span class="form-error" id="confirm-error"></span>
          </div>
          <div class="form-check" style="margin-bottom:var(--space-5)">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="/help.html">Terms of Service</a> and <a href="/help.html">Privacy Policy</a></label>
          </div>
          <div id="form-error" class="form-error" style="margin-bottom:var(--space-4);text-align:center;font-size:var(--font-size-sm)"></div>
          <button type="submit" id="register-btn" class="btn btn-primary btn-block btn-lg">🚀 Create Account</button>
        </form>
        <p style="text-align:center;font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-5)">
          Already have an account? <a href="/signin.html" style="color:var(--color-primary);font-weight:600">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = '/account-profile.html';

    function togglePw(id) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function checkPasswordStrength(val) {
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { pct:'0%', color:'transparent', text:'' },
        { pct:'25%', color:'var(--color-error)', text:'Weak' },
        { pct:'50%', color:'var(--color-warning)', text:'Fair' },
        { pct:'75%', color:'var(--color-info)', text:'Good' },
        { pct:'100%', color:'var(--color-success)', text:'Strong' },
      ];
      fill.style.width = levels[score].pct;
      fill.style.background = levels[score].color;
      label.textContent = levels[score].text;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const errorEl = document.getElementById('form-error');
      errorEl.textContent = '';

      const name = document.getElementById('full-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!name) { document.getElementById('name-error').textContent = 'Name is required'; return; }
      if (!email) { document.getElementById('email-error').textContent = 'Email is required'; return; }
      if (password.length < 8) { document.getElementById('password-error').textContent = 'At least 8 characters'; return; }
      if (password !== confirm) { document.getElementById('confirm-error').textContent = 'Passwords do not match'; return; }
      if (!document.getElementById('terms').checked) { errorEl.textContent = 'You must agree to the terms'; return; }

      btn.disabled = true;
      btn.textContent = '⏳ Creating account...';

      try {
        const data = await api.register({ name, email, phone, password });
        Auth.setSession(data.token, data.customer);
        showToast(`Welcome to TECHNOVA, ${name}! 🎉`, 'success');
        setTimeout(() => { window.location.href = '/account-profile.html'; }, 1000);
      } catch(err) {
        errorEl.textContent = err.message || 'Registration failed. Please try again.';
        btn.disabled = false;
        btn.textContent = '🚀 Create Account';
      }
    });
  </script>
</body>
</html>
