<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TECHNOVA</title>
  <meta name="description" content="Sign in to your TECHNOVA account to shop, track orders, and manage your wishlist.">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/components.css">
  <style>
    body { background: linear-gradient(135deg, var(--color-navy) 0%, #0F2D5B 50%, var(--color-navy-light) 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4); }
    .auth-card { background: white; border-radius: var(--radius-2xl); box-shadow: var(--shadow-2xl); width: 100%; max-width: 440px; overflow: hidden; }
    .auth-header { background: linear-gradient(135deg, var(--color-primary), var(--color-accent-purple)); padding: var(--space-8); text-align: center; color: white; }
    .auth-body { padding: var(--space-8); }
    .divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; color: var(--color-text-muted); font-size: var(--font-size-xs); }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
    .auth-top-bar { background: rgba(255,255,255,0.08); padding: var(--space-4) var(--space-6); display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="auth-top-bar">
    <a href="/index.html" class="header-logo" style="text-decoration:none">
      <div class="logo-mark" style="width:28px;height:28px;font-size:0.85rem">T</div>
      <span class="logo-text" style="color:white;font-size:var(--font-size-lg)">TECH<span style="color:#60B2FF">NOVA</span></span>
    </a>
    <a href="/index.html" style="color:rgba(255,255,255,0.7);font-size:var(--font-size-sm)">← Back to Store</a>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size:2.5rem;margin-bottom:var(--space-3)">👤</div>
        <h1 style="font-size:var(--font-size-2xl);font-weight:var(--font-weight-extrabold);margin-bottom:var(--space-2)">Welcome Back</h1>
        <p style="opacity:0.85;font-size:var(--font-size-sm)">Sign in to your TECHNOVA account</p>
      </div>
      <div class="auth-body">
        <div class="payment-demo-notice" style="margin-bottom:var(--space-5)">
          <div class="notice-icon">💡</div>
          <div>
            <strong>Demo Accounts Available</strong><br>
            • Email: <code>demo@technova.com</code> / Password: <code>test123</code><br>
            • Email: <code>alex@example.com</code> / Password: <code>Password123!</code>
          </div>
        </div>

        <form id="signin-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email Address <span>*</span></label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            <span class="form-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password <span>*</span></label>
            <div style="position:relative">
              <input type="password" id="password" class="form-input" placeholder="Your password" required autocomplete="current-password" style="padding-right:3rem">
              <button type="button" id="toggle-pw" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--color-text-muted)">👁</button>
            </div>
            <span class="form-error" id="password-error"></span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5)">
            <div class="form-check">
              <input type="checkbox" id="remember-me">
              <label for="remember-me">Remember me</label>
            </div>
            <a href="/help.html" style="font-size:var(--font-size-sm);color:var(--color-primary)">Forgot password?</a>
          </div>
          <div id="form-error" class="form-error" style="margin-bottom:var(--space-4);font-size:var(--font-size-sm);text-align:center"></div>
          <button type="submit" id="signin-btn" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div class="divider">or continue with</div>
        <div style="display:flex;gap:var(--space-3)">
          <button class="btn btn-outline-dark w-full" onclick="showToast('OAuth not configured for academic demo', 'info')">🍎 Apple</button>
          <button class="btn btn-outline-dark w-full" onclick="showToast('OAuth not configured for academic demo', 'info')">G Google</button>
        </div>

        <p style="text-align:center;font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-6)">
          Don't have an account? <a href="/register.html" style="color:var(--color-primary);font-weight:600">Create Account</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/account-profile.html';
      window.location.href = redirect;
    }

    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signin-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('form-error');
      errorEl.textContent = '';

      if (!email) { document.getElementById('email-error').textContent = 'Email is required'; return; }
      if (!password) { document.getElementById('password-error').textContent = 'Password is required'; return; }

      btn.disabled = true;
      btn.textContent = '⏳ Signing in...';

      try {
        const data = await api.login({ email, password });
        Auth.setSession(data.token, data.customer);
        showToast(`Welcome back, ${data.customer.name}!`, 'success');
        setTimeout(() => {
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/account-profile.html';
          window.location.href = redirect;
        }, 800);
      } catch(err) {
        errorEl.textContent = err.message || 'Invalid email or password';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
