<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — TECHNOVA</title>
  <meta name="description" content="Review your shopping cart and proceed to checkout at TECHNOVA.">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/components.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-8); align-items: start; }
    .cart-box { background: white; border-radius: var(--radius-xl); border: 1px solid var(--color-border); padding: var(--space-6); }
    .cart-box-title { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-5); padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
    @media(max-width:768px){ .cart-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="announcement-bar">🎉 Free shipping on orders over $100! <a href="/shop.html">Shop Now →</a></div>
  <header class="header"><div class="container header-inner">
    <a href="/index.html" class="header-logo"><div class="logo-mark">T</div><span class="logo-text">TECH<span>NOVA</span></span></a>
    <div class="search-bar"><div class="search-input-wrap"><input type="text" id="search-input" class="search-input" placeholder="Search products..."><button class="search-btn" id="search-btn">🔍 Search</button></div></div>
    <div class="header-actions">
      <a href="/account-profile.html" id="account-btn" class="header-action-btn"><span>👤</span><span class="action-label" id="account-label">Account</span></a>
      <a href="/wishlist.html" class="header-action-btn"><span>♡</span><span class="action-label">Wishlist</span><span class="action-badge" id="wishlist-badge" style="display:none">0</span></a>
      <a href="/cart.html" class="header-action-btn"><span>🛒</span><span class="action-label">Cart</span><span class="action-badge" id="cart-badge" style="display:none">0</span></a>
    </div>
  </div></header>

  <main class="container section page-enter">
    <div class="breadcrumb"><a href="/index.html">Home</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Shopping Cart</span></div>
    <h1 style="font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);margin-bottom:var(--space-6)">Shopping Cart</h1>
    <div id="cart-container">
      <div class="spinner"></div>
    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 TECHNOVA. All rights reserved.</span></div></div></footer>
  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script>
  <script>
    Auth.updateHeaderUI(); CartManager.updateBadge(); WishlistManager.updateBadge();
    document.getElementById('search-btn').addEventListener('click', () => { const q = document.getElementById('search-input').value.trim(); if(q) window.location.href=`/search.html?q=${encodeURIComponent(q)}`; });
    document.getElementById('search-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('search-btn').click(); });

    let cartData = { items: [], total: 0 };

    async function loadCart() {
      const container = document.getElementById('cart-container');
      if (!Auth.isLoggedIn()) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔒</div><div class="empty-state-title">Sign in to view your cart</div><div class="empty-state-desc">Create an account or sign in to start shopping</div><a href="/signin.html?redirect=/cart.html" class="btn btn-primary">Sign In</a><a href="/register.html" class="btn btn-outline mt-4" style="margin-left:1rem">Create Account</a></div>`;
        return;
      }
      try {
        const data = await api.getCart();
        cartData = data;
        renderCart(data);
      } catch(err) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Could not load cart</div><div class="empty-state-desc">${err.message}</div></div>`;
      }
    }

    function renderCart(data) {
      const container = document.getElementById('cart-container');
      const items = data.items || [];
      if (!items.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🛒</div><div class="empty-state-title">Your cart is empty</div><div class="empty-state-desc">Looks like you haven't added any items yet</div><a href="/shop.html" class="btn btn-primary">Start Shopping</a></div>`;
        return;
      }
      const subtotal = items.reduce((s, i) => s + (i.price * i.quantity), 0);
      const shipping = subtotal >= 100 ? 0 : 9.99;
      const tax = subtotal * 0.08;
      const total = subtotal + shipping + tax;

      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-box">
            <div class="cart-box-title">
              <span>Cart Items (${items.length})</span>
              <button class="btn btn-ghost btn-sm" onclick="clearCartHandler()">🗑️ Clear All</button>
            </div>
            <div id="cart-items">
              ${items.map(item => `
                <div class="cart-item" id="cart-item-${item.productId}">
                  <div class="cart-item-image">
                    <img src="${item.image || 'https://via.placeholder.com/100'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/100?text=No+Img'">
                  </div>
                  <div>
                    <div class="cart-item-brand">${item.brand || ''}</div>
                    <div class="cart-item-name"><a href="/product.html?id=${item.productId}" style="color:inherit;text-decoration:none">${item.name}</a></div>
                    <div class="quantity-control" style="margin-top:0.75rem">
                      <button class="qty-btn" onclick="updateQty('${item.productId}', ${item.quantity - 1})">−</button>
                      <span class="qty-value">${item.quantity}</span>
                      <button class="qty-btn" onclick="updateQty('${item.productId}', ${item.quantity + 1})">+</button>
                    </div>
                  </div>
                  <div style="text-align:right">
                    <div class="cart-item-price">${formatCurrency(item.price * item.quantity)}</div>
                    <div style="font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:2px">${formatCurrency(item.price)} each</div>
                    <button class="cart-remove-btn" onclick="removeItem('${item.productId}')">🗑️</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="order-summary-box" style="position:sticky;top:calc(var(--header-height) + var(--announcement-height) + 1rem)">
            <div class="order-summary-title">Order Summary</div>
            <div class="order-summary-row"><span>Subtotal (${items.length} items)</span><span>${formatCurrency(subtotal)}</span></div>
            <div class="order-summary-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--color-success)">FREE</span>' : formatCurrency(shipping)}</span></div>
            <div class="order-summary-row"><span>Estimated Tax (8%)</span><span>${formatCurrency(tax)}</span></div>
            <div class="order-summary-row total"><span>Total</span><span>${formatCurrency(total)}</span></div>
            ${shipping > 0 ? `<div style="margin:0.5rem 0;padding:0.5rem;background:var(--color-primary-50);border-radius:var(--radius-md);font-size:var(--font-size-xs);color:var(--color-primary)">Add ${formatCurrency(100 - subtotal)} more for free shipping!</div>` : ''}
            <a href="/checkout-shipping.html" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-4)">Proceed to Checkout →</a>
            <a href="/shop.html" class="btn btn-outline-dark btn-block" style="margin-top:var(--space-3)">Continue Shopping</a>
          </div>
        </div>`;
    }

    async function updateQty(productId, newQty) {
      if (newQty < 1) { removeItem(productId); return; }
      try {
        await api.updateCartItem(productId, newQty);
        await loadCart();
        await CartManager.updateBadge();
      } catch(err) { showToast(err.message, 'error'); }
    }

    async function removeItem(productId) {
      try {
        await api.removeFromCart(productId);
        await loadCart();
        await CartManager.updateBadge();
        showToast('Item removed from cart', 'info');
      } catch(err) { showToast(err.message, 'error'); }
    }

    async function clearCartHandler() {
      if (!confirm('Remove all items from cart?')) return;
      try {
        await api.clearCart();
        await loadCart();
        await CartManager.updateBadge();
        showToast('Cart cleared', 'info');
      } catch(err) { showToast(err.message, 'error'); }
    }

    loadCart();
  </script>
</body>
</html>
