<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details — TECHNOVA</title>
  <meta name="description" content="View detailed information and tracking for your TECHNOVA order.">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/components.css">
  <style>
    .detail-layout { display: grid; grid-template-columns: 1fr 320px; gap: var(--space-8); align-items: start; }
    @media(max-width:768px){ .detail-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="announcement-bar">🎉 Free shipping on orders over $100! <a href="/shop.html">Shop Now →</a></div>
  <header class="header"><div class="container header-inner">
    <a href="/index.html" class="header-logo"><div class="logo-mark">T</div><span class="logo-text">TECH<span>NOVA</span></span></a>
    <div class="search-bar"><div class="search-input-wrap"><input type="text" id="search-input" class="search-input" placeholder="Search products..."><button class="search-btn" id="search-btn">🔍 Search</button></div></div>
    <div class="header-actions">
      <a href="/account-profile.html" id="account-btn" class="header-action-btn"><span>👤</span><span class="action-label" id="account-label">Account</span></a>
      <a href="/wishlist.html" class="header-action-btn"><span>♡</span><span class="action-label">Wishlist</span><span class="action-badge" id="wishlist-badge" style="display:none">0</span></a>
      <a href="/cart.html" class="header-action-btn"><span>🛒</span><span class="action-label">Cart</span><span class="action-badge" id="cart-badge" style="display:none">0</span></a>
    </div>
  </div></header>

  <main class="container section page-enter">
    <div class="breadcrumb"><a href="/index.html">Home</a><span class="breadcrumb-sep">›</span><a href="/account-orders.html">My Orders</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current" id="bc-order">Order Details</span></div>
    <div id="page-content"><div class="spinner"></div></div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 TECHNOVA. All rights reserved.</span></div></div></footer>
  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    Auth.updateHeaderUI(); CartManager.updateBadge(); WishlistManager.updateBadge();
    document.getElementById('search-btn').addEventListener('click', () => { const q = document.getElementById('search-input').value.trim(); if(q) window.location.href=`/search.html?q=${encodeURIComponent(q)}`; });
    document.getElementById('search-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('search-btn').click(); });

    const orderId = new URLSearchParams(window.location.search).get('id');

    async function loadOrderDetails() {
      if (!orderId) { document.getElementById('page-content').innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-title">Order not found</div><a href="/account-orders.html" class="btn btn-primary">Back to Orders</a></div>'; return; }
      try {
        const data = await api.getOrder(orderId);
        const o = data.order;
        document.getElementById('bc-order').textContent = `Order #${o.order_id}`;
        document.title = `Order #${o.order_id} — TECHNOVA`;

        const statusClass = { pending:'status-pending', processing:'status-processing', shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled' };
        const timeline = [
          { label: 'Order Placed', done: true, date: formatDate(o.order_date) },
          { label: 'Payment Confirmed', done: ['processing','shipped','delivered'].includes(o.status), date: '' },
          { label: 'Order Shipped', done: ['shipped','delivered'].includes(o.status), date: '' },
          { label: 'Out for Delivery', done: o.status === 'delivered', date: '' },
          { label: 'Delivered', done: o.status === 'delivered', date: '' },
        ];

        const shippingAddr = o.shipping_address || {};

        document.getElementById('page-content').innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6);flex-wrap:wrap;gap:var(--space-3)">
            <div>
              <h1 style="font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold)">Order #${o.order_id}</h1>
              <div style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-1)">Placed on ${formatDate(o.order_date)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:var(--space-3)">
              <span class="status-badge ${statusClass[o.status]||'status-processing'}">${o.status}</span>
              <a href="/account-orders.html" class="btn btn-outline-dark btn-sm">← All Orders</a>
            </div>
          </div>

          <div class="detail-layout">
            <div>
              <!-- Items -->
              <div class="card" style="margin-bottom:var(--space-5)">
                <div class="card-title" style="font-size:var(--font-size-base)">Items Ordered</div>
                ${(o.items||[]).map(i => `
                  <div style="display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--color-border)">
                    <div style="width:60px;height:60px;background:var(--color-background);border-radius:var(--radius-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem">📦</div>
                    <div style="flex:1">
                      <div style="font-weight:600;font-size:var(--font-size-sm)">${i.product_name||'Product'}</div>
                      <div style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Qty: ${i.quantity} · ${formatCurrency(i.unit_price)} each</div>
                    </div>
                    <div style="font-weight:700">${formatCurrency(i.total_price||i.unit_price*i.quantity)}</div>
                  </div>`).join('')}
              </div>

              <!-- Tracking Timeline -->
              <div class="card" style="margin-bottom:var(--space-5)">
                <div class="card-title" style="font-size:var(--font-size-base)">📍 Order Tracking</div>
                <div class="tracking-timeline">
                  ${timeline.map((step, idx) => `
                    <div class="timeline-item ${step.done ? 'done' : idx === timeline.findIndex(s => !s.done) ? 'active' : ''}">
                      <div class="timeline-dot"></div>
                      <div class="timeline-title">${step.label}</div>
                      <div class="timeline-date">${step.done ? (step.date || 'Completed') : 'Pending'}</div>
                    </div>`).join('')}
                </div>
              </div>
            </div>

            <!-- Sidebar -->
            <div>
              <!-- Order Summary -->
              <div class="order-summary-box" style="margin-bottom:var(--space-5)">
                <div class="order-summary-title" style="font-size:var(--font-size-base)">Payment Summary</div>
                <div class="order-summary-row"><span>Subtotal</span><span>${formatCurrency(o.subtotal||o.total_amount)}</span></div>
                <div class="order-summary-row"><span>Shipping</span><span>${o.shipping_cost > 0 ? formatCurrency(o.shipping_cost) : 'FREE'}</span></div>
                <div class="order-summary-row"><span>Tax</span><span>${formatCurrency(o.tax_amount||0)}</span></div>
                <div class="order-summary-row total"><span>Total</span><span>${formatCurrency(o.total_amount)}</span></div>
                ${o.payment ? `<div style="margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--color-border);font-size:var(--font-size-xs);color:var(--color-text-muted)">Payment Ref: ${o.payment.payment_reference||'—'}</div>` : ''}
              </div>

              <!-- Shipping Address -->
              <div class="card" style="margin-bottom:var(--space-5)">
                <div style="font-weight:600;margin-bottom:var(--space-3);font-size:var(--font-size-sm)">📦 Delivery Address</div>
                <div style="font-size:var(--font-size-sm);color:var(--color-text-secondary);line-height:1.75">
                  ${shippingAddr.name ? `<strong>${shippingAddr.name}</strong><br>` : ''}
                  ${shippingAddr.address ? shippingAddr.address + '<br>' : ''}
                  ${shippingAddr.city ? `${shippingAddr.city}, ${shippingAddr.state} ${shippingAddr.zip}` : ''}
                  ${shippingAddr.country ? '<br>' + shippingAddr.country : ''}
                </div>
              </div>

              <!-- Actions -->
              <div style="display:flex;flex-direction:column;gap:var(--space-3)">
                ${o.status === 'delivered' ? `<a href="/help.html#returns" class="btn btn-outline btn-block">↩ Request Return</a>` : ''}
                <a href="/help.html#contact" class="btn btn-outline-dark btn-block">❓ Need Help?</a>
                <a href="/shop.html" class="btn btn-primary btn-block">🛍️ Continue Shopping</a>
              </div>
            </div>
          </div>`;
      } catch(err) {
        document.getElementById('page-content').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Could not load order</div><div class="empty-state-desc">${err.message}</div><a href="/account-orders.html" class="btn btn-primary mt-4">Back to Orders</a></div>`;
      }
    }

    loadOrderDetails();
  </script>
</body>
</html>
